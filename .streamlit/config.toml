[theme]
base = "dark"
primaryColor = "#38bdf8"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"
font = "sans serif"

# Sidebar page titles ("Home", "Run", …) are declared in `src/hwa_gui/Home.py` via `st.navigation` / `st.Page(..., title=...)`.
# Streamlit does not implement a `[pages]` table in `config.toml` for `pages/*.py` auto-discovery.

[client]
showSidebarNavigation = true

[server]
headless = true

[browser]
gatherUsageStats = false
